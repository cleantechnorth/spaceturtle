<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 68" width="108" height="68">
  <defs>
    <!-- Wooden shell gradient -->
    <radialGradient id="sg" cx="40%" cy="35%" r="62%">
      <stop offset="0%"   stop-color="#D4956A"/>
      <stop offset="45%"  stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#4A2810"/>
    </radialGradient>
    <!-- Metallic skin gradient -->
    <radialGradient id="sk" cx="38%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#B0C0C0"/>
      <stop offset="60%"  stop-color="#6B7D7D"/>
      <stop offset="100%" stop-color="#3A4E4E"/>
    </radialGradient>
    <!-- Brass gradient -->
    <radialGradient id="br" cx="35%" cy="28%" r="62%">
      <stop offset="0%"   stop-color="#F5E070"/>
      <stop offset="48%"  stop-color="#C8A030"/>
      <stop offset="100%" stop-color="#7A5C10"/>
    </radialGradient>
    <!-- Head gradient -->
    <radialGradient id="hd" cx="40%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#9AACAC"/>
      <stop offset="100%" stop-color="#485A5A"/>
    </radialGradient>
    <!-- Dark gear-window interior -->
    <radialGradient id="gw" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#201408"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
  </defs>

  <!-- ── Back flippers (drawn first, behind shell) ── -->
  <ellipse cx="19" cy="15" rx="16" ry="6.5"
           transform="rotate(-32 19 15)"
           fill="url(#sk)" stroke="#3A4E4E" stroke-width="0.7"/>
  <ellipse cx="19" cy="49" rx="16" ry="6.5"
           transform="rotate(32 19 49)"
           fill="url(#sk)" stroke="#3A4E4E" stroke-width="0.7"/>

  <!-- ── Neck connecting shell to head ── -->
  <ellipse cx="74" cy="32" rx="13" ry="9" fill="url(#sk)"/>

  <!-- ── Shell (main oval) ── -->
  <ellipse cx="43" cy="32" rx="33" ry="23"
           fill="url(#sg)" stroke="#3A1E08" stroke-width="1.3"/>

  <!-- ── Wood-panel lines on shell ── -->
  <!-- vertical centre line -->
  <path d="M 43 9 Q 47 20 43 32 Q 39 44 43 55"
        stroke="#3A1808" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- top & bottom horizontal rails -->
  <path d="M 15 27 Q 30 22 53 22 Q 68 23 76 30"
        stroke="#3A1808" stroke-width="1.0" fill="none" opacity="0.5"/>
  <path d="M 14 37 Q 29 43 52 43 Q 67 42 76 35"
        stroke="#3A1808" stroke-width="1.0" fill="none" opacity="0.5"/>
  <!-- left-side diagonal rib -->
  <path d="M 20 17 Q 31 24 33 32 Q 31 41 20 47"
        stroke="#3A1808" stroke-width="0.8" fill="none" opacity="0.45"/>
  <!-- right-side diagonal rib -->
  <path d="M 58 10 Q 64 21 65 32 Q 64 43 58 54"
        stroke="#3A1808" stroke-width="0.8" fill="none" opacity="0.45"/>

  <!-- ── Gear window (left panel cutout) ── -->
  <ellipse cx="28" cy="32" rx="10" ry="14"
           fill="url(#gw)" stroke="#C8A030" stroke-width="1.6"/>

  <!-- Large gear ring -->
  <circle cx="28" cy="34" r="8"   fill="none" stroke="#C8A030" stroke-width="3.8"/>
  <circle cx="28" cy="34" r="2.8" fill="url(#br)"/>
  <!-- Spokes -->
  <line x1="28" y1="26" x2="28" y2="42" stroke="#C8A030" stroke-width="1.3"/>
  <line x1="20" y1="34" x2="36" y2="34" stroke="#C8A030" stroke-width="1.3"/>
  <line x1="22.3" y1="28.3" x2="33.7" y2="39.7" stroke="#C8A030" stroke-width="1.0"/>
  <line x1="33.7" y1="28.3" x2="22.3" y2="39.7" stroke="#C8A030" stroke-width="1.0"/>
  <!-- Gear teeth (N/S/E/W) -->
  <rect x="26.5" y="23.5" width="3" height="3.2" rx="0.4" fill="#C8A030"/>
  <rect x="26.5" y="41.3" width="3" height="3.2" rx="0.4" fill="#C8A030"/>
  <rect x="17.5" y="32.5" width="3.2" height="3" rx="0.4" fill="#C8A030"/>
  <rect x="37.3" y="32.5" width="3.2" height="3" rx="0.4" fill="#C8A030"/>

  <!-- Small secondary gear at top of window -->
  <circle cx="28" cy="21" r="4.2" fill="none" stroke="#C8A030" stroke-width="2.2"/>
  <circle cx="28" cy="21" r="1.6" fill="#C8A030"/>
  <rect x="26.5" y="16.5" width="3" height="2"   rx="0.3" fill="#C8A030"/>
  <rect x="26.5" y="22.8" width="3" height="2"   rx="0.3" fill="#C8A030"/>
  <rect x="23.0" y="19.5" width="2" height="3"   rx="0.3" fill="#C8A030"/>
  <rect x="33.0" y="19.5" width="2" height="3"   rx="0.3" fill="#C8A030"/>

  <!-- Connector rod between gears -->
  <rect x="27.2" y="25.5" width="1.6" height="2.5" fill="#C8A030" opacity="0.7"/>

  <!-- Shell highlight (slight sheen at top) -->
  <ellipse cx="40" cy="19" rx="14" ry="5.5"
           fill="white" opacity="0.07"
           transform="rotate(-12 40 19)"/>

  <!-- Brass rivets on shell rim -->
  <circle cx="11"  cy="32" r="1.8" fill="url(#br)"/>
  <circle cx="75"  cy="32" r="1.8" fill="url(#br)"/>
  <circle cx="43"  cy="9"  r="1.8" fill="url(#br)"/>
  <circle cx="43"  cy="55" r="1.8" fill="url(#br)"/>

  <!-- ── Front flippers ── -->
  <ellipse cx="66" cy="17" rx="13.5" ry="5.5"
           transform="rotate(-26 66 17)"
           fill="url(#sk)" stroke="#3A4E4E" stroke-width="0.7"/>
  <ellipse cx="66" cy="47" rx="13.5" ry="5.5"
           transform="rotate(26 66 47)"
           fill="url(#sk)" stroke="#3A4E4E" stroke-width="0.7"/>

  <!-- Flipper scale texture hints (small oval highlights) -->
  <ellipse cx="61" cy="12" rx="4" ry="1.8"
           fill="white" opacity="0.09" transform="rotate(-26 61 12)"/>
  <ellipse cx="61" cy="52" rx="4" ry="1.8"
           fill="white" opacity="0.09" transform="rotate(26 61 52)"/>

  <!-- ── Head ── -->
  <ellipse cx="86" cy="31" rx="11.5" ry="10"
           fill="url(#hd)" stroke="#3A4E4E" stroke-width="0.7"/>

  <!-- Scale bumps on head surface -->
  <circle cx="80" cy="35" r="1.3" fill="#485A5A" opacity="0.45"/>
  <circle cx="84" cy="37" r="1.1" fill="#485A5A" opacity="0.40"/>
  <circle cx="78" cy="28" r="1.1" fill="#485A5A" opacity="0.40"/>
  <circle cx="83" cy="25" r="1.0" fill="#485A5A" opacity="0.35"/>

  <!-- Monocle (brass ring with blue lens) -->
  <circle cx="91" cy="28" r="7"   fill="#08061A" stroke="#C8A030" stroke-width="2.4"/>
  <circle cx="91" cy="28" r="4.5" fill="#0B2245" opacity="0.92"/>
  <!-- lens flare -->
  <circle cx="89" cy="26" r="1.4" fill="white" opacity="0.55"/>
  <!-- pupil -->
  <circle cx="91" cy="28" r="2.2" fill="#04020E"/>
  <!-- inner iris ring -->
  <circle cx="91" cy="28" r="3.5" fill="none" stroke="#1A4488" stroke-width="0.8" opacity="0.6"/>

  <!-- Monocle chain / strap -->
  <path d="M 97 24 Q 100 19 97 14"
        stroke="#C8A030" stroke-width="1.4" fill="none"
        stroke-linecap="round" stroke-dasharray="1.5,1.5"/>

  <!-- Top brass gear-accent on head (steampunk detail) -->
  <circle cx="87" cy="20" r="3.5" fill="none" stroke="#C8A030" stroke-width="1.5"/>
  <circle cx="87" cy="20" r="1.2" fill="#C8A030"/>
</svg>
