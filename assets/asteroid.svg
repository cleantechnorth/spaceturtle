<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rocky stone gradient – lit from top-left -->
    <radialGradient id="rk" cx="33%" cy="28%" r="65%">
      <stop offset="0%"   stop-color="#A09890"/>
      <stop offset="50%"  stop-color="#6B6460"/>
      <stop offset="100%" stop-color="#30302C"/>
    </radialGradient>
    <!-- Dark shadow on underside -->
    <radialGradient id="sh" cx="60%" cy="70%" r="55%">
      <stop offset="0%"   stop-color="#18181A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#18181A" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Metallic vein highlight -->
    <linearGradient id="mv" x1="20%" y1="15%" x2="75%" y2="80%">
      <stop offset="0%"   stop-color="#C8C0B0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8C0B0" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- ── Main rocky blob (10-point irregular polygon) ── -->
  <!-- Points placed at varying radii to look natural and bumpy -->
  <polygon
    points="57,28  50,46  43,58  28,62  14,55   6,42   4,26  12,12  28,6  48,10"
    fill="url(#rk)" stroke="#22201E" stroke-width="1.5"
    stroke-linejoin="round"/>

  <!-- Shadow gradient overlay for depth -->
  <polygon
    points="57,28  50,46  43,58  28,62  14,55   6,42   4,26  12,12  28,6  48,10"
    fill="url(#sh)"/>

  <!-- ── Surface cracks ── -->
  <path d="M 30 18 Q 36 28 34 40 Q 32 50 29 56"
        stroke="#1E1C18" stroke-width="1.3" fill="none" opacity="0.55"/>
  <path d="M 46 16 Q 50 26 47 42"
        stroke="#1E1C18" stroke-width="1.0" fill="none" opacity="0.45"/>
  <path d="M 14 30 Q 22 35 28 38 Q 34 41 36 52"
        stroke="#1E1C18" stroke-width="1.0" fill="none" opacity="0.45"/>
  <path d="M 18 18 Q 24 24 22 32"
        stroke="#1E1C18" stroke-width="0.8" fill="none" opacity="0.35"/>

  <!-- ── Craters (impact pits) ── -->
  <ellipse cx="22" cy="30" rx="7" ry="6"
           fill="#28261E" opacity="0.40"/>
  <ellipse cx="46" cy="40" rx="5" ry="4.5"
           fill="#28261E" opacity="0.35"/>
  <ellipse cx="34" cy="52" rx="4" ry="3"
           fill="#28261E" opacity="0.30"/>
  <!-- Crater rim highlights -->
  <ellipse cx="20" cy="28" rx="5" ry="3"
           fill="none" stroke="#8A8478" stroke-width="0.7" opacity="0.5"/>
  <ellipse cx="44" cy="38" rx="3.5" ry="3"
           fill="none" stroke="#8A8478" stroke-width="0.6" opacity="0.4"/>

  <!-- ── Metallic vein (light streak) ── -->
  <polygon
    points="57,28  50,46  43,58  28,62  14,55   6,42   4,26  12,12  28,6  48,10"
    fill="url(#mv)"/>

  <!-- ── Bright specular highlight (top-left lit) ── -->
  <ellipse cx="22" cy="16" rx="11" ry="6"
           fill="white" opacity="0.10"
           transform="rotate(-20 22 16)"/>

  <!-- ── Small metallic glint spots ── -->
  <circle cx="44" cy="18" r="2.2" fill="#D0C8B0" opacity="0.65"/>
  <circle cx="14" cy="44" r="1.8" fill="#D0C8B0" opacity="0.55"/>
  <circle cx="54" cy="46" r="1.6" fill="#D0C8B0" opacity="0.55"/>
  <circle cx="28" cy="10" r="1.5" fill="#D0C8B0" opacity="0.50"/>
</svg>
