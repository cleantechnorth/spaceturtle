<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Petal blade: bright tip fading to dark base -->
    <linearGradient id="blg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#FFB0DC"/>
      <stop offset="40%"  stop-color="#E82080"/>
      <stop offset="100%" stop-color="#601030"/>
    </linearGradient>
    <!-- Edge highlight streak -->
    <linearGradient id="hl" x1="20%" y1="10%" x2="55%" y2="60%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <!-- ── Petal blade: elongated pointed oval, vertical ── -->
  <!-- Tip at top (16,2), base at bottom (16,30), width ~7 at widest -->
  <path d="M 16,2 C 22,10 22,22 16,30 C 10,22 10,10 16,2 Z"
        fill="url(#blg)" stroke="#881040" stroke-width="0.8"
        stroke-linejoin="round"/>

  <!-- Blade ridge (lighter centre vein) -->
  <line x1="16" y1="4" x2="16" y2="28"
        stroke="#FFAAD0" stroke-width="0.9" opacity="0.70"/>

  <!-- Specular highlight along left edge -->
  <path d="M 16,2 C 12,10 11,20 14,28"
        fill="url(#hl)" stroke="none" opacity="0.60"/>

  <!-- Sharp tip glint -->
  <circle cx="16" cy="3" r="1.4" fill="white" opacity="0.65"/>
</svg>
