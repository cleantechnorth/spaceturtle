<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <defs>
    <!-- Outer brass gradient -->
    <radialGradient id="bg" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#F8EA80"/>
      <stop offset="42%"  stop-color="#C8A030"/>
      <stop offset="100%" stop-color="#6B4A0E"/>
    </radialGradient>
    <!-- Inner hub gradient (slightly darker / worn) -->
    <radialGradient id="hb" cx="38%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#E8D060"/>
      <stop offset="55%"  stop-color="#A87820"/>
      <stop offset="100%" stop-color="#5A3C08"/>
    </radialGradient>
    <!-- Engraved groove shadow -->
    <radialGradient id="gr" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3A2808" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#3A2808" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- ── 8-tooth gear body ── -->
  <!-- Points alternate: r=27 at tooth tips, r=20 at tooth roots, 8 teeth -->
  <polygon
    points="55,28  46.5,35.6  47.1,47.1  35.6,46.5
            28,55   20.4,46.5   8.9,47.1   9.5,35.6
             1,28    9.5,20.4   8.9, 8.9  20.4, 9.5
            28, 1   35.6, 9.5  47.1, 8.9  46.5,20.4"
    fill="url(#bg)" stroke="#5A3C08" stroke-width="1.2"
    stroke-linejoin="round"/>

  <!-- Shadow overlay to add depth to gear ring face -->
  <circle cx="28" cy="28" r="20" fill="url(#gr)" opacity="0.35"/>

  <!-- Raised gear face ring -->
  <circle cx="28" cy="28" r="19.5"
          fill="url(#hb)" stroke="#5A3C08" stroke-width="1.0"/>

  <!-- Engraved ring detail -->
  <circle cx="28" cy="28" r="14.5"
          fill="none" stroke="#3A2808" stroke-width="1.4" opacity="0.5"/>

  <!-- Spokes (4 arms) -->
  <line x1="28" y1="13.5" x2="28" y2="42.5" stroke="#5A3C08" stroke-width="2.5" opacity="0.5"/>
  <line x1="13.5" y1="28" x2="42.5" y2="28" stroke="#5A3C08" stroke-width="2.5" opacity="0.5"/>

  <!-- Centre hub boss -->
  <circle cx="28" cy="28" r="6.5" fill="#8A6018" stroke="#5A3C08" stroke-width="1.0"/>
  <circle cx="28" cy="28" r="3.5" fill="#C8A030"/>
  <!-- Centre hole -->
  <circle cx="28" cy="28" r="1.8" fill="#1A0C02"/>

  <!-- Highlight sheen (top-left glint) -->
  <ellipse cx="21" cy="19" rx="8" ry="4"
           fill="white" opacity="0.18"
           transform="rotate(-35 21 19)"/>

  <!-- Small rivet dots at compass points of hub ring -->
  <circle cx="28" cy="15" r="1.3" fill="#E0C048"/>
  <circle cx="28" cy="41" r="1.3" fill="#E0C048"/>
  <circle cx="15" cy="28" r="1.3" fill="#E0C048"/>
  <circle cx="41" cy="28" r="1.3" fill="#E0C048"/>
</svg>
